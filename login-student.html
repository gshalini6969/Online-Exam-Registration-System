<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Login — Online Exam Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #2ec27e;
      --green-dark: #1fa868;
      --green-light: #e8faf2;
      --dark: #0d1b2a;
      --text: #1c3144;
      --muted: #8ca0b3;
      --border: #e2eaf2;
      --white: #ffffff;
      --bg: #f4f7f9;
      --error: #e74c3c;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
    }

    .page {
      min-height: 100vh;
      display: flex;
    }

    /* ── LEFT ACCENT STRIP ── */
    .accent-strip {
      width: 6px;
      background: linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
      flex-shrink: 0;
    }

    /* ── MAIN CONTENT ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      position: relative;
    }

    /* subtle background circles */
    .main::before {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(46,194,126,0.07) 0%, transparent 65%);
      top: -150px; right: -100px;
      border-radius: 50%;
      pointer-events: none;
    }

    .main::after {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(46,194,126,0.05) 0%, transparent 65%);
      bottom: -100px; left: -80px;
      border-radius: 50%;
      pointer-events: none;
    }

    /* top nav bar */
    .topbar {
      position: absolute;
      top: 28px;
      left: 36px;
      right: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: var(--dark);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 14px;
      color: var(--green);
    }

    .logo-label {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--dark);
      max-width: 120px;
      line-height: 1.3;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-btn:hover { color: var(--dark); }
    .back-btn svg { transition: transform 0.2s; }
    .back-btn:hover svg { transform: translateX(-3px); }

    /* card */
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: 24px;
      padding: 44px 44px 40px;
      box-shadow: 0 8px 48px rgba(13,27,42,0.09), 0 1px 3px rgba(13,27,42,0.04);
      animation: slideUp 0.5s ease both;
      position: relative;
      z-index: 1;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-role-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--green-light);
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 100px;
      margin-bottom: 20px;
      letter-spacing: 0.3px;
    }

    .card-role-badge svg { color: var(--green); }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 27px;
      font-weight: 800;
      color: var(--dark);
      letter-spacing: -0.6px;
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 34px;
      line-height: 1.5;
    }

    /* form */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: 0.1px;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px;
      color: var(--dark);
      background: #fafcfe;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .form-input::placeholder { color: #b8c9d9; }

    .form-input:focus {
      border-color: var(--green);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(46,194,126,0.12);
    }

    .form-input:focus + .input-icon-right,
    .input-wrap:focus-within .input-icon { color: var(--green); }

    /* password toggle */
    .toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 2px;
      line-height: 0;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--dark); }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -10px;
      margin-bottom: 28px;
    }

    .forgot-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--green-dark);
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .forgot-link:hover { opacity: 0.75; text-decoration: underline; }

    .submit-btn {
      width: 100%;
      padding: 14.5px;
      background: var(--green);
      color: var(--white);
      border: none;
      border-radius: 13px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 16px rgba(46,194,126,0.35);
    }

    .submit-btn:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(46,194,126,0.4);
    }

    .submit-btn:active { transform: translateY(0); }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px 0 20px;
    }

    .divider-line { flex: 1; height: 1px; background: var(--border); }
    .divider-text { font-size: 12.5px; color: #b0bec5; font-weight: 500; }

    .signup-row {
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    .signup-link {
      color: var(--green-dark);
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .signup-link:hover { text-decoration: underline; opacity: 0.8; }

    /* forgot password modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13,27,42,0.45);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--white);
      border-radius: 20px;
      padding: 36px 36px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(13,27,42,0.2);
      transform: scale(0.94) translateY(10px);
      transition: transform 0.25s;
    }

    .modal-overlay.open .modal {
      transform: scale(1) translateY(0);
    }

    .modal h3 {
      font-family: 'Syne', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 6px;
    }

    .modal p {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .modal-close {
      position: absolute;
      top: 14px; right: 18px;
      background: none; border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--muted);
    }

    .modal-close:hover { color: var(--dark); }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .btn-secondary {
      flex: 1;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-secondary:hover { border-color: var(--dark); color: var(--dark); }

    .btn-primary {
      flex: 1;
      padding: 12px;
      background: var(--green);
      border: none;
      border-radius: 11px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--white);
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover { background: var(--green-dark); }
  </style>
</head>
<body>

<div class="page">
  <div class="accent-strip"></div>

  <div class="main">

    <!-- Top bar -->
    <div class="topbar">
      <a href="index.html" class="logo">
        <div class="logo-icon">OE</div>
        <div class="logo-label">Online Exam Registration</div>
      </a>
      <a href="index.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back
      </a>
    </div>

    <!-- Card -->
    <div class="card">
      <div class="card-role-badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        Student Portal
      </div>
      <h1 class="card-title">Sign in to your account</h1>
      <p class="card-sub">Enter your credentials to access your exam dashboard.</p>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrap">
          <svg class="input-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input class="form-input" id="username" type="text" placeholder="Enter your username" autocomplete="username"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input class="form-input" id="password" type="password" placeholder="Enter your password" autocomplete="current-password"/>
          <button class="toggle-pw" onclick="togglePw('password', this)" type="button" aria-label="Show password">
            <svg id="eye-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="forgot-row">
        <a href="#" class="forgot-link" onclick="openModal(event)">Forgot Password?</a>
      </div>

      <button class="submit-btn" type="button">Login</button>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">Don't have an account?</div>
        <div class="divider-line"></div>
      </div>

      <div class="signup-row">
        <a href="signup.html" class="signup-link">Create a new account →</a>
      </div>
    </div>

  </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal-overlay" id="forgotModal">
  <div class="modal" style="position:relative;">
    <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
    <h3>Reset Password</h3>
    <p>Enter your registered username and we'll help you reset your password.</p>

    <div class="form-group">
      <label class="form-label" for="reset-user">Username</label>
      <div class="input-wrap">
        <svg class="input-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input class="form-input" id="reset-user" type="text" placeholder="Your username"/>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="closeModal()">Send Reset Link</button>
    </div>
  </div>
</div>

<script>
  function togglePw(inputId, btn) {
    const inp = document.getElementById(inputId);
    const isHidden = inp.type === 'password';
    inp.type = isHidden ? 'text' : 'password';
    btn.querySelector('svg').innerHTML = isHidden
      ? '<line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }

  function openModal(e) {
    e.preventDefault();
    document.getElementById('forgotModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('forgotModal').classList.remove('open');
  }

  document.getElementById('forgotModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>

</body>
</html>
