<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — Online Exam Registration</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #2ec27e;
      --green-dark: #1fa868;
      --green-light: #e8faf2;
      --dark: #0d1b2a;
      --text: #1c3144;
      --muted: #8ca0b3;
      --border: #e2eaf2;
      --white: #ffffff;
      --bg: #f4f7f9;
      --error: #e74c3c;
      --error-light: #fef2f2;
      --success: #2ec27e;
    }

    html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); }

    .page { min-height: 100vh; display: flex; }

    .accent-strip {
      width: 6px;
      background: linear-gradient(180deg, var(--green) 0%, var(--green-dark) 100%);
      flex-shrink: 0;
    }

    .main {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 24px 48px;
      position: relative;
    }

    .main::before {
      content: '';
      position: fixed; width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(46,194,126,0.07) 0%, transparent 65%);
      top: -100px; right: -80px;
      border-radius: 50%; pointer-events: none;
    }

    .main::after {
      content: '';
      position: fixed; width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(46,194,126,0.05) 0%, transparent 65%);
      bottom: -80px; left: -60px;
      border-radius: 50%; pointer-events: none;
    }

    .topbar {
      position: fixed;
      top: 0; left: 6px; right: 0;
      background: rgba(244,247,249,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226,234,242,0.8);
      padding: 16px 36px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 10;
    }

    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }

    .logo-icon {
      width: 36px; height: 36px; background: var(--dark);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px; color: var(--green);
    }

    .logo-label {
      font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
      color: var(--dark); max-width: 120px; line-height: 1.3;
    }

    .back-btn {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 500; color: var(--muted);
      text-decoration: none; transition: color 0.2s;
    }
    .back-btn:hover { color: var(--dark); }
    .back-btn:hover svg { transform: translateX(-3px); }
    .back-btn svg { transition: transform 0.2s; }

    .card {
      width: 100%; max-width: 480px;
      background: var(--white);
      border-radius: 24px;
      padding: 44px 44px 40px;
      box-shadow: 0 8px 48px rgba(13,27,42,0.09), 0 1px 3px rgba(13,27,42,0.04);
      animation: slideUp 0.5s ease both;
      position: relative; z-index: 1;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-role-badge {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--green-light); color: var(--green-dark);
      font-size: 12px; font-weight: 600;
      padding: 5px 14px; border-radius: 100px;
      margin-bottom: 20px; letter-spacing: 0.3px;
    }

    .card-title {
      font-family: 'Syne', sans-serif;
      font-size: 27px; font-weight: 800;
      color: var(--dark); letter-spacing: -0.6px;
      margin-bottom: 6px;
    }

    .card-sub {
      font-size: 14px; color: var(--muted);
      margin-bottom: 30px; line-height: 1.5;
    }

    /* two-column grid for wider card */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group { margin-bottom: 18px; }

    .form-label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--text); margin-bottom: 8px; letter-spacing: 0.1px;
    }

    .input-wrap { position: relative; }

    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none; transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px; color: var(--dark);
      background: #fafcfe; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .form-input::placeholder { color: #b8c9d9; }

    .form-input:focus {
      border-color: var(--green);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(46,194,126,0.12);
    }

    .form-input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 4px rgba(231,76,60,0.1);
    }

    .form-input.success {
      border-color: var(--success);
    }

    .input-wrap:focus-within .input-icon { color: var(--green); }

    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--muted); padding: 2px; line-height: 0; transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--dark); }

    .field-hint {
      font-size: 11.5px; color: var(--muted);
      margin-top: 6px; line-height: 1.4;
    }

    .field-hint.err { color: var(--error); }

    /* password strength */
    .strength-bar {
      display: flex; gap: 4px; margin-top: 8px;
    }

    .strength-seg {
      flex: 1; height: 3px;
      background: var(--border);
      border-radius: 100px;
      transition: background 0.3s;
    }

    .strength-seg.weak    { background: #e74c3c; }
    .strength-seg.fair    { background: #f59e0b; }
    .strength-seg.good    { background: #3b82f6; }
    .strength-seg.strong  { background: var(--green); }

    .strength-label {
      font-size: 11.5px; margin-top: 5px;
      font-weight: 600; color: var(--muted);
    }

    /* divider */
    .section-divider {
      height: 1px; background: var(--border);
      margin: 8px 0 20px;
    }

    .section-title {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: #b0bec5; margin-bottom: 18px;
    }

    .submit-btn {
      width: 100%; padding: 14.5px;
      background: var(--green); color: var(--white);
      border: none; border-radius: 13px;
      font-family: 'Syne', sans-serif;
      font-size: 15px; font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      letter-spacing: 0.2px;
      box-shadow: 0 4px 16px rgba(46,194,126,0.35);
      margin-top: 8px;
    }

    .submit-btn:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(46,194,126,0.4);
    }

    .submit-btn:active { transform: translateY(0); }

    .login-row {
      text-align: center;
      font-size: 14px; color: var(--muted);
      margin-top: 22px;
    }

    .login-link {
      color: var(--green-dark); font-weight: 600;
      text-decoration: none; transition: opacity 0.2s;
    }

    .login-link:hover { text-decoration: underline; opacity: 0.8; }

    /* terms checkbox */
    .terms-row {
      display: flex; align-items: flex-start; gap: 10px;
      margin: 18px 0 4px;
    }

    .terms-checkbox {
      width: 17px; height: 17px;
      accent-color: var(--green);
      flex-shrink: 0;
      margin-top: 2px;
      cursor: pointer;
    }

    .terms-text {
      font-size: 13px; color: var(--muted); line-height: 1.5;
    }

    .terms-text a { color: var(--green-dark); text-decoration: none; }
    .terms-text a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="page">
  <div class="accent-strip"></div>

  <div class="main">

    <!-- Fixed Top bar -->
    <div class="topbar">
      <a href="index.html" class="logo">
        <div class="logo-icon">OE</div>
        <div class="logo-label">Online Exam Registration</div>
      </a>
      <a href="login-student.html" class="back-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Login
      </a>
    </div>

    <!-- Card -->
    <div class="card">
      <div class="card-role-badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        New Student Account
      </div>
      <h1 class="card-title">Create your account</h1>
      <p class="card-sub">Fill in the details below to register and get started.</p>

      <!-- Personal Info -->
      <div class="section-title">Personal Information</div>

      <div class="form-group">
        <label class="form-label" for="fullname">Full Name</label>
        <div class="input-wrap">
          <svg class="input-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input class="form-input" id="fullname" type="text" placeholder="e.g. Ravi Kumar" autocomplete="name"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <div class="input-wrap">
          <svg class="input-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          <input class="form-input" id="username" type="text" placeholder="Choose a username" autocomplete="username" oninput="checkUsername(this)"/>
        </div>
        <div class="field-hint" id="username-hint">Must be 4–20 characters, letters and numbers only.</div>
      </div>

      <div class="section-divider"></div>
      <div class="section-title">Security</div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input class="form-input" id="password" type="password" placeholder="Create a strong password" autocomplete="new-password" oninput="checkStrength(this.value)"/>
          <button class="toggle-pw" onclick="togglePw('password', this)" type="button" aria-label="Show password">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength-bar">
          <div class="strength-seg" id="s1"></div>
          <div class="strength-seg" id="s2"></div>
          <div class="strength-seg" id="s3"></div>
          <div class="strength-seg" id="s4"></div>
        </div>
        <div class="strength-label" id="strength-label">Enter a password</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-password">Confirm Password</label>
        <div class="input-wrap">
          <svg class="input-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <input class="form-input" id="confirm-password" type="password" placeholder="Re-enter your password" autocomplete="new-password" oninput="checkMatch()"/>
          <button class="toggle-pw" onclick="togglePw('confirm-password', this)" type="button" aria-label="Show password">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="field-hint" id="match-hint"></div>
      </div>

      <div class="terms-row">
        <input type="checkbox" id="terms" class="terms-checkbox"/>
        <label for="terms" class="terms-text">
          I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a> of the Online Exam Registration System.
        </label>
      </div>

      <button class="submit-btn" type="button" onclick="submitForm()">Create Account</button>

      <div class="login-row">
        Already have an account? <a href="login-student.html" class="login-link">Sign in →</a>
      </div>
    </div>

  </div>
</div>

<script>
  function togglePw(inputId, btn) {
    const inp = document.getElementById(inputId);
    const isHidden = inp.type === 'password';
    inp.type = isHidden ? 'text' : 'password';
    btn.querySelector('svg').innerHTML = isHidden
      ? '<line x1="1" y1="1" x2="23" y2="23"/><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }

  function checkUsername(inp) {
    const val = inp.value;
    const hint = document.getElementById('username-hint');
    if (val.length === 0) {
      inp.className = 'form-input';
      hint.textContent = 'Must be 4–20 characters, letters and numbers only.';
      hint.className = 'field-hint';
    } else if (!/^[a-zA-Z0-9_]{4,20}$/.test(val)) {
      inp.className = 'form-input error';
      hint.textContent = '⚠ Username must be 4–20 characters (letters, numbers, underscores).';
      hint.className = 'field-hint err';
    } else {
      inp.className = 'form-input success';
      hint.textContent = '✓ Username looks good!';
      hint.className = 'field-hint';
      hint.style.color = 'var(--green-dark)';
    }
  }

  function checkStrength(pw) {
    const segs = [document.getElementById('s1'), document.getElementById('s2'),
                  document.getElementById('s3'), document.getElementById('s4')];
    const label = document.getElementById('strength-label');
    let score = 0;
    if (pw.length >= 8) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^a-zA-Z0-9]/.test(pw)) score++;

    const classes = ['', 'weak', 'fair', 'good', 'strong'];
    const labels  = ['Enter a password', '⚠ Too weak', '◑ Fair', '● Good', '✓ Strong'];
    const colors  = ['#b0bec5', '#e74c3c', '#f59e0b', '#3b82f6', '#2ec27e'];

    segs.forEach((s, i) => {
      s.className = 'strength-seg' + (i < score ? ' ' + classes[score] : '');
    });
    label.textContent = pw.length === 0 ? 'Enter a password' : labels[score];
    label.style.color = pw.length === 0 ? '#b0bec5' : colors[score];
  }

  function checkMatch() {
    const pw = document.getElementById('password').value;
    const cp = document.getElementById('confirm-password');
    const hint = document.getElementById('match-hint');
    if (cp.value.length === 0) {
      cp.className = 'form-input';
      hint.textContent = '';
      return;
    }
    if (pw === cp.value) {
      cp.className = 'form-input success';
      hint.textContent = '✓ Passwords match';
      hint.style.color = 'var(--green-dark)';
      hint.className = 'field-hint';
    } else {
      cp.className = 'form-input error';
      hint.textContent = '⚠ Passwords do not match';
      hint.className = 'field-hint err';
    }
  }

  function submitForm() {
    const name = document.getElementById('fullname').value.trim();
    const user = document.getElementById('username').value.trim();
    const pw   = document.getElementById('password').value;
    const cp   = document.getElementById('confirm-password').value;
    const terms = document.getElementById('terms').checked;

    if (!name || !user || !pw || !cp) {
      alert('Please fill in all fields.');
      return;
    }
    if (!/^[a-zA-Z0-9_]{4,20}$/.test(user)) {
      alert('Please enter a valid username.');
      return;
    }
    if (pw !== cp) {
      alert('Passwords do not match.');
      return;
    }
    if (!terms) {
      alert('Please agree to the Terms of Service to continue.');
      return;
    }
    alert('Account created successfully! You can now log in.');
    window.location.href = 'login-student.html';
  }
</script>
</body>
</html>
