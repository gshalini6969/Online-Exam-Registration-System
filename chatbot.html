  .msg { max-width:75%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.6; }

  #inputRow input:focus { border-color:#4caf7d; box-shadow: 0 0 0 3px rgba(76,175,125,0.15); }
  #inputRow button { background:#4caf7d; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-weight:700; cursor:pointer; font-size:14px; }
  #inputRow button:hover { background:#3d9e6c; }
</style>
</head>
